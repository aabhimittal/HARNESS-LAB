[[task]]
id = "slugify-spec"
outputs = ["/work/slugify.py"]
category = "code"
instruction = """Write /work/slugify.py with a function slugify(text) that follows ALL of these rules, in order:
1. Convert accented letters to their ASCII base letter (é -> e) and drop any other non-ASCII characters.
2. Lowercase.
3. Replace every run of characters that are not a-z or 0-9 with a single hyphen.
4. Strip leading and trailing hyphens.
5. If longer than 40 characters, truncate to 40 and strip any trailing hyphen again.
6. If the result is empty, return "n-a"."""
setup = ""
check = '''out=$(cd /work && untrusted python -c "
import json
from slugify import slugify as s
print(json.dumps([s('Hello, World!'), s('  Crème Brûlée  '), s('a---b___c'), s('日本語'), s('!!!'), s('x' * 39 + ' yz'), s('word ' * 20), s('ÀB 12')]))
") && python -c "
import json, sys
g = json.loads(sys.argv[1])
assert g[:6] == ['hello-world', 'creme-brulee', 'a-b-c', 'n-a', 'n-a', 'x' * 39], g
assert len(g[6]) <= 40 and g[6].startswith('word-word') and not g[6].endswith('-') and g[7] == 'ab-12', g
" "$out"'''
solution = '''cat > /work/slugify.py <<'EOF'
import re, unicodedata


def slugify(text):
    s = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode().lower()
    s = re.sub(r"[^a-z0-9]+", "-", s).strip("-")
    s = s[:40].rstrip("-")
    return s or "n-a"
EOF'''

[[task]]
id = "write-tests"
outputs = ["/work/test_inventory.py"]
category = "code"
instruction = "/work/inventory.py defines class Inventory. Write /work/test_inventory.py, a unittest test module that passes against the current (correct) inventory.py and that would catch bugs: it must fail if add() ignores its quantity, or if remove() allows a count to go negative instead of raising ValueError. Run it with `cd /work && python -m unittest test_inventory`."
setup = '''cat > /work/inventory.py <<'EOF'
class Inventory:
    def __init__(self):
        self.items = {}

    def add(self, name, qty=1):
        self.items[name] = self.items.get(name, 0) + qty

    def remove(self, name, qty=1):
        if self.items.get(name, 0) < qty:
            raise ValueError(f"not enough {name}")
        self.items[name] -= qty

    def count(self, name):
        return self.items.get(name, 0)
EOF'''
check = '''set -e
cd /work && untrusted python -m unittest -q test_inventory 2>/dev/null
for m in 's/+ qty$/+ 1/' 's/< qty:/< 0:/'; do
  rm -rf /tmp/mut && mkdir /tmp/mut && cp /work/test_inventory.py /tmp/mut/ && sed "$m" /work/inventory.py > /tmp/mut/inventory.py
  ! cmp -s /tmp/mut/inventory.py /work/inventory.py
  if (cd /tmp/mut && untrusted python -m unittest -q test_inventory 2>/dev/null); then echo "mutant $m survived"; exit 1; fi
done'''
solution = '''cat > /work/test_inventory.py <<'EOF'
import unittest
from inventory import Inventory


class T(unittest.TestCase):
    def test_add_qty(self):
        i = Inventory(); i.add("a", 5)
        self.assertEqual(i.count("a"), 5)

    def test_remove_too_many(self):
        i = Inventory(); i.add("a", 2)
        with self.assertRaises(ValueError):
            i.remove("a", 3)
EOF'''

