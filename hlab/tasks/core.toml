# Core suite: harder than smoke, chosen so harness factors have something to bite on (huge outputs, many
# requirements, independent subtasks, tests to write, exact formats). Same schema as smoke.toml.
# Checks recompute answers from the task's own data where possible, so they don't hardcode generator output.
# Checks run in a fresh grader container (see hlab/run.py grade). Run agent code there only via `untrusted`
