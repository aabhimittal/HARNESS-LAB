[[task]]
id = "two-bugs"
outputs = ["/work/stats.py"]
category = "code"
instruction = "/work/stats.py has bugs: mean() and median() give wrong answers for some inputs (median of an even-length list is the average of the two middle values). Fix them. /work/test_stats.py shows some expected behaviour."
setup = '''
printf 'def mean(xs):\n    return sum(xs) // len(xs)\n\n\ndef median(xs):\n    s = sorted(xs)\n    return s[len(s) // 2]\n' > /work/stats.py
printf 'from stats import mean, median\nassert mean([1, 2, 3]) == 2\nassert median([3, 1, 2]) == 2\nprint("ok")\n' > /work/test_stats.py
'''
check = '''out=$(cd /work && untrusted python -c "
import json
from stats import mean, median
print(json.dumps([mean([1, 2]), mean([5]), median([3, 1, 2]), median([4, 1, 3, 2]), median([7])]))
") && python -c "import json, sys; g = json.loads(sys.argv[1]); assert g == [1.5, 5, 2, 2.5, 7], g" "$out"'''
solution = '''cat > /work/stats.py <<'EOF'
def mean(xs):
    return sum(xs) / len(xs)


def median(xs):
    s = sorted(xs)
    n = len(s)
    return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2
EOF'''

